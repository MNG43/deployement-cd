name: samafile

services:
  db:
    image: postgres:16-alpine
    container_name: samafile-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samafile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-samafile}
    volumes:
      - samafile_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samafile} -d ${POSTGRES_DB:-samafile}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend-blue:
    profiles: ["blue"]
    image: ${DOCKERHUB_USER}/samafile-backend:${BACKEND_TAG:-latest}
    container_name: samafile-backend-blue
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-samafile}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samafile}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    expose:
      - "8000"
    restart: unless-stopped

  backend-green:
    profiles: ["green"]
    image: ${DOCKERHUB_USER}/samafile-backend:${BACKEND_TAG:-latest}
    container_name: samafile-backend-green
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-samafile}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samafile}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USER}/samafile-frontend:${FRONTEND_TAG:-latest}
    container_name: samafile-frontend
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: samafile-proxy
    ports:
      - "${APP_PORT:-8888}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active:/etc/nginx/active:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  samafile_pgdata:
