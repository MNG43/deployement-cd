worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Réécrit par scripts/blue-green-deploy.sh avant nginx -s reload.
    include /etc/nginx/active/upstream.conf;

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;

        location /api/ {
            proxy_pass http://samafile_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://samafile_api/health;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://samafile_api/docs;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://samafile_api/openapi.json;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://samafile_api/redoc;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
