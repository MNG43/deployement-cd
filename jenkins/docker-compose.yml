name: samafile-jenkins

services:
  jenkins:
    build: .
    image: samafile/jenkins:local
    container_name: samafile-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    restart: unless-stopped

volumes:
  jenkins_home:
